[package]
name = "rustdocs-mcp"
version = "0.1.0"
edition = "2021"
description = "MCP server exposing Rust crate documentation from crates.io and docs.rs (rustdoc JSON) to AI assistants."
license = "MIT OR Apache-2.0"
repository = "https://github.com/JLFN/rustdocs-mcp"

[dependencies]
anyhow = "1"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.1.0", features = ["transport-io"] }
rustdoc-types = "0.60"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
zstd = "0.13"

[profile.release]
strip = true
