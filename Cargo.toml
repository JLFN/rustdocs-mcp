[package]
name = "rustdocs-mcp"
version = "0.1.1"
edition = "2021"
rust-version = "1.88"
description = "Rust crate documentation server for AI assistants via MCP"
license = "MIT OR Apache-2.0"
readme = "README.md"
repository = "https://github.com/JLFN/rustdocs-mcp"
homepage = "https://github.com/JLFN/rustdocs-mcp"
documentation = "https://docs.rs/rustdocs-mcp"
keywords = ["mcp", "crates-io", "docs", "rustdoc", "documentation"]
categories = ["development-tools", "command-line-utilities"]

[dependencies]
anyhow = "1"
flate2 = "1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rmcp = { version = "3.1.0", features = ["transport-io"] }
rustdoc-types = "0.60"
semver = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tar = "0.4"
tokio = { version = "1", features = ["full"] }
zstd = "0.13"

[profile.release]
strip = true
